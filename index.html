<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfotec Refrigeração | Qualidade e Confiança</title>
    <style>
        :root {
            --primary: #004a99; /* Azul Royal */
            --secondary: #ffffff; /* Branco */
            --gray: #e0e0e0; /* Cinza */
            --dark: #333333;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; color: var(--dark); line-height: 1.6; }
        header { background: var(--primary); color: var(--secondary); padding: 3rem 1rem; text-align: center; }
        .hero { padding: 4rem 1rem; text-align: center; background: var(--gray); }
        .container { padding: 2rem; max-width: 900px; margin: auto; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .gallery img { width: 100%; border-radius: 8px; border: 2px solid var(--primary); }
        .btn { display: inline-block; padding: 12px 25px; margin: 10px; border-radius: 5px; text-decoration: none; font-weight: bold; }
        .btn-whats { background: #25d366; color: white; }
        .btn-face { background: #4267B2; color: white; }
        footer { background: var(--dark); color: white; text-align: center; padding: 2rem; }
    </style>
</head>
<body>
    <header>
        <h1>Alfotec Refrigeração</h1>
        <p>Expertise em Geladeiras e Soluções Térmicas</p>
    </header>
    
    <section class="container">
        <h2>Nossa Galeria</h2>
        <div class="gallery">
            <img src="https://via.placeholder.com/300x200.png?text=Geladeira+1" alt="Geladeira">
            <img src="https://via.placeholder.com/300x200.png?text=Geladeira+2" alt="Geladeira">
            <img src="https://via.placeholder.com/300x200.png?text=Geladeira+3" alt="Geladeira">
        </div>

        <div style="text-align: center;">
            <a href="https://wa.me/SEUNUMERO" class="btn btn-whats">Falar com Consultor (WhatsApp)</a>
            <a href="https://facebook.com/SUAPAGINA" class="btn btn-face">Falar com Consultor (Facebook)</a>
        </div>
    </section>

    <footer>
        <p>&copy; 2023 Alfotec Refrigeração - Qualidade que você confia.</p>
    </footer>
</body>
</html>
