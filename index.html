<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfotec Refrigeração - Qualidade em Geladeiras</title>
    <style>
        :root {
            --primary: #0056b3;
            --secondary: #ffffff;
            --accent: #f4f4f4;
            --text: #333;
        }
        body { font-family: 'Arial', sans-serif; margin: 0; padding: 0; color: var(--text); }
        header { background: var(--primary); color: var(--secondary); padding: 1rem; text-align: center; }
        .hero { padding: 2rem; text-align: center; background: var(--accent); }
        .content { padding: 2rem; max-width: 800px; margin: auto; }
        footer { background: var(--primary); color: var(--secondary); text-align: center; padding: 1rem; position: fixed; width: 100%; bottom: 0; }
        @media (max-width: 600px) { .content { padding: 1rem; } }
    </style>
</head>
<body>
    <header>
        <h1>Alfotec Refrigeração</h1>
    </header>
    <section class="hero">
        <h2>Especialistas em Refrigeração</h2>
        <p>Qualidade e confiança para o seu lar.</p>
    </section>
    <div class="content">
        <h3>Nossos Serviços</h3>
        <p>Venda, manutenção e assistência técnica de geladeiras e sistemas de refrigeração.</p>
    </div>
    <footer>
        <p>&copy; 2023 Alfotec Refrigeração - O melhor para o seu conforto.</p>
    </footer>
</body>
</html>
