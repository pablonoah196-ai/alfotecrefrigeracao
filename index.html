<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfotec Refrigeração - Qualidade em Geladeiras</title>
    <style>
        :root {
            --primary: #0056b3;
            --secondary: #f4f4f4;
            --text: #333;
            --white: #ffffff;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; color: var(--text); }
        header { background: var(--primary); color: var(--white); padding: 2rem; text-align: center; }
        .container { padding: 20px; max-width: 800px; margin: auto; }
        .hero { text-align: center; padding: 40px 20px; background: var(--secondary); }
        footer { text-align: center; padding: 20px; background: var(--primary); color: var(--white); margin-top: 20px; }
        @media (max-width: 600px) { header { padding: 1rem; } }
    </style>
</head>
<body>
    <header>
        <h1>Alfotec Refrigeração</h1>
    </header>
    <section class="hero">
        <h2>Especialistas em Refrigeração</h2>
        <p>Venda e manutenção de geladeiras com qualidade e confiança.</p>
    </section>
    <div class="container">
        <h3>Nossos Serviços</h3>
        <ul>
            <li>Venda de Geladeiras Novas e Semi-novas</li>
            <li>Manutenção Técnica Especializada</li>
            <li>Peças de Reposição</li>
        </ul>
    </div>
    <footer>
        &copy; 2023 Alfotec Refrigeração - Soluções para sua casa.
    </footer>
</body>
</html>
